<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post</title>
</head>
<body>
    <section>
        <h1>Edit Post</h1>

        <form id="editPost-form">
            <label for="title">Title</label>
            <input type="text" name="title" id="title" value = "" required>
            <br>
            <textarea name="content" id="content" placeholder="Write your content here..." rows="40" cols="20" value = ""></textarea>
            <br>
            <input type="checkbox" id="published" name="published" value="Published">
            <label for="published">Published</label>
            <br>
            <button type="submit">Submit Post</button>
            <br>
            <button type="button" id="deletePost">Delete Post</button>
        </form>
    </section>

    <section>
        <ul id="comment-list"></ul>
    </section>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/editPost.js"></script>
</body>
</html>
